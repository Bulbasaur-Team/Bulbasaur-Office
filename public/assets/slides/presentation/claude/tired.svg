<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540">

  <defs>
    <linearGradient id="night" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#06111c"/><stop offset="0.55" stop-color="#0a1b2b"/><stop offset="1" stop-color="#10263a"/>
    </linearGradient>
    <linearGradient id="mint" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="#38f2cf"/><stop offset="1" stop-color="#7effa5"/>
    </linearGradient>
    <linearGradient id="sun" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#ffd76a"/><stop offset="1" stop-color="#ff8a4c"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#ffffff" stop-opacity=".16"/><stop offset="1" stop-color="#ffffff" stop-opacity=".035"/>
    </linearGradient>
    <radialGradient id="glow"><stop stop-color="#38f2cf" stop-opacity=".35"/><stop offset="1" stop-color="#38f2cf" stop-opacity="0"/></radialGradient>
    <pattern id="grid" width="42" height="42" patternUnits="userSpaceOnUse">
      <path d="M42 0H0V42" fill="none" stroke="#8eb5c9" stroke-opacity=".07"/>
    </pattern>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="180%">
      <feDropShadow dx="0" dy="16" stdDeviation="17" flood-color="#000" flood-opacity=".35"/>
    </filter>
    <filter id="soft"><feGaussianBlur stdDeviation="12"/></filter>
    <filter id="photo"><feColorMatrix values="0.96 0 0 0 0  0 1.02 0 0 0  0 0 1.08 0 0  0 0 0 1 0"/></filter>
  </defs>
  <rect width="960" height="540" fill="url(#night)"/>
  <rect width="960" height="540" fill="url(#grid)" opacity="1"/>
  <circle cx="866" cy="76" r="230" fill="#ff6b8d" opacity=".08"/>
  <text x="48" y="52" font-family="Inter,Arial,sans-serif" font-size="11" font-weight="900" letter-spacing="2.4" fill="#ff6b8d">07  /  ЧЕСТНО</text>
  <text x="48" y="108" font-family="Inter,Arial,sans-serif" font-size="42" font-weight="850" letter-spacing="-1.2" fill="#f8f4e9">Модели устали</text>
  <rect x="48" y="130" width="72" height="5" rx="3" fill="#ff6b8d"/>
  <g style="--ink:#f8f4e9;--muted:#91a9b9;--accent:#ff6b8d">
  <g transform="translate(48 164)">
    <rect width="406" height="274" rx="32" fill="url(#glass)" stroke="#fff" stroke-opacity=".1"/>
    <text x="34" y="46" font-family="Inter,Arial" font-size="12" font-weight="900" letter-spacing="1.7" fill="#91a9b9">TOKEN BALANCE</text>
    <text x="34" y="143" font-family="Inter,Arial" font-size="96" font-weight="950" fill="#ff6b8d">0</text>
    <rect x="34" y="183" width="322" height="28" rx="14" fill="#20394b"/>
    <rect x="34" y="183" width="8" height="28" rx="4" fill="#ff6b8d"/>
    <rect x="362" y="190" width="10" height="14" rx="3" fill="#496275"/>
    <text x="34" y="246" font-family="Inter,Arial" font-size="17" font-weight="750" fill="#f8f4e9">Бюджет съеден проектом Т.</text>
  </g>
  <g transform="translate(482 164)">
    <rect width="430" height="274" rx="32" fill="url(#glass)" stroke="#fff" stroke-opacity=".1"/>
    <text x="34" y="46" font-family="Inter,Arial" font-size="12" font-weight="900" letter-spacing="1.7" fill="#91a9b9">MODEL STATUS</text>
    <path d="M40 198 C110 180 125 98 190 112 S276 208 388 72" fill="none" stroke="#ff6b8d" stroke-width="5" stroke-linecap="round"/>
    <path d="M40 198 C110 180 125 98 190 112 S276 208 388 72" fill="none" stroke="#ff6b8d" stroke-opacity=".17" stroke-width="22" filter="url(#soft)"/>
    <line x1="40" y1="216" x2="390" y2="216" stroke="#40596b"/>
    <circle cx="388" cy="72" r="9" fill="#ff6b8d"/>
    <text x="34" y="246" font-family="Inter,Arial" font-size="17" font-weight="750" fill="#f8f4e9">Отдых нужен моделям. Деньги — нам.</text>
  </g></g>

  <text x="48" y="512" font-family="Inter,Arial,sans-serif" font-size="11" font-weight="800" letter-spacing="2.2" fill="#91a9b9">BULBA OFFICE  /  ДЕНЬ X</text>
