      <text y="92" font-family="Inter,Arial" font-size="44" font-weight="900" fill="#f8f4e9">срок</text>
      <text y="132" font-family="Inter,Arial" font-size="21" font-weight="750" fill="#91a9b9">дни → часы</text>
      <rect y="174" width="288" height="14" rx="7" fill="#304a5c"/><rect y="174" width="198" height="14" rx="7" fill="#ff9d59"/>
    </g>
    <path d="M396 136h74m-22-25 25 25-25 25" fill="none" stroke="#38f2cf" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
    <g transform="translate(524 38)">
      <text y="22" font-family="Inter,Arial" font-size="12" font-weight="900" letter-spacing="1.7" fill="#38f2cf">ECOM ПОСЛЕ ПИЛОТА</text>
      <text y="92" font-family="Inter,Arial" font-size="44" font-weight="900" fill="#38f2cf">без срока</text>
      <text y="132" font-family="Inter,Arial" font-size="21" font-weight="750" fill="#f8f4e9">сразу</text>
      <rect y="174" width="288" height="14" rx="7" fill="#304a5c"/><rect y="174" width="288" height="14" rx="7" fill="url(#mint)"/>
    </g>
  </g>
  <text x="48" y="469" font-family="Inter,Arial" font-size="22" font-weight="750" fill="#f8f4e9">Мы продаём не скорость. Мы убираем ожидание.</text></g>

