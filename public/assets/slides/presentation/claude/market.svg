  <text x="48" y="108" font-family="Inter,Arial,sans-serif" font-size="42" font-weight="850" letter-spacing="-1.2" fill="#f8f4e9">Революция в ecom</text>
  <rect x="48" y="130" width="72" height="5" rx="3" fill="#38f2cf"/>
  <g style="--ink:#f8f4e9;--muted:#91a9b9;--accent:#38f2cf">
  <g transform="translate(48 165)">
