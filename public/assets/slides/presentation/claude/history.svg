  <text x="48" y="108" font-family="Inter,Arial,sans-serif" font-size="42" font-weight="850" letter-spacing="-1.2" fill="#f8f4e9">От коробки до маршрута</text>
  <rect x="48" y="130" width="72" height="5" rx="3" fill="#ffd76a"/>
