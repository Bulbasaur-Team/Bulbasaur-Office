<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540">

  <defs>
    <linearGradient id="night" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#06111c"/><stop offset="0.55" stop-color="#0a1b2b"/><stop offset="1" stop-color="#10263a"/>
    </linearGradient>
    <linearGradient id="mint" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="#38f2cf"/><stop offset="1" stop-color="#7effa5"/>
    </linearGradient>
    <linearGradient id="sun" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#ffd76a"/><stop offset="1" stop-color="#ff8a4c"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#ffffff" stop-opacity=".16"/><stop offset="1" stop-color="#ffffff" stop-opacity=".035"/>
    </linearGradient>
    <radialGradient id="glow"><stop stop-color="#38f2cf" stop-opacity=".35"/><stop offset="1" stop-color="#38f2cf" stop-opacity="0"/></radialGradient>
    <pattern id="grid" width="42" height="42" patternUnits="userSpaceOnUse">
      <path d="M42 0H0V42" fill="none" stroke="#8eb5c9" stroke-opacity=".07"/>
    </pattern>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="180%">
      <feDropShadow dx="0" dy="16" stdDeviation="17" flood-color="#000" flood-opacity=".35"/>
    </filter>
    <filter id="soft"><feGaussianBlur stdDeviation="12"/></filter>
    <filter id="photo"><feColorMatrix values="0.96 0 0 0 0  0 1.02 0 0 0  0 0 1.08 0 0  0 0 0 1 0"/></filter>
  </defs>
  <image href="media/vietnam-beach-hub.jpg" width="960" height="640" y="-50" preserveAspectRatio="xMidYMid slice"/>
  <linearGradient id="paper" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#f6f0df"/><stop offset=".49" stop-color="#f6f0df" stop-opacity=".94"/><stop offset=".72" stop-color="#f6f0df" stop-opacity="0"/></linearGradient>
  <rect width="960" height="540" fill="url(#paper)"/>
  <text x="48" y="52" font-family="Inter,Arial" font-size="11" font-weight="900" letter-spacing="2.4" fill="#168c78">05  /  ПЕРВЫЙ ХАБ</text>
  <text x="48" y="115" font-family="Inter,Arial" font-size="43" font-weight="850" letter-spacing="-1.3" fill="#102437">Пилот: точка</text>
  <text x="48" y="164" font-family="Inter,Arial" font-size="43" font-weight="850" letter-spacing="-1.3" fill="#102437">прибытия</text>
  <rect x="48" y="188" width="72" height="5" rx="3" fill="#168c78"/>
  <text x="48" y="253" font-family="Inter,Arial" font-size="23" font-weight="800" fill="#102437">Вьетнамский пляж.</text>
  <text x="48" y="290" font-family="Inter,Arial" font-size="19" font-weight="700" fill="#526b72">Первая живая точка —</text>
  <text x="48" y="320" font-family="Inter,Arial" font-size="19" font-weight="700" fill="#526b72">туда и обратно.</text>
  <g transform="translate(48 368)">
    <rect width="228" height="58" rx="18" fill="#fff" fill-opacity=".64" stroke="#168c78" stroke-opacity=".26"/>
    <circle cx="31" cy="29" r="10" fill="#168c78"/><circle cx="31" cy="29" r="18" fill="none" stroke="#168c78" stroke-opacity=".25"/>
    <text x="58" y="36" font-family="Inter,Arial" font-size="17" font-weight="900" fill="#18564e">ХАБ ONLINE</text>
  </g>

  <text x="48" y="512" font-family="Inter,Arial,sans-serif" font-size="11" font-weight="800" letter-spacing="2.2" fill="#18564e">BULBA OFFICE  /  ДЕНЬ X</text>
  <rect x="745" y="505" width="8" height="5" rx="3" fill="#173b42" opacity="0.25"/><rect x="762" y="505" width="8" height="5" rx="3" fill="#173b42" opacity="0.25"/><rect x="779" y="505" width="8" height="5" rx="3" fill="#173b42" opacity="0.25"/><rect x="796" y="505" width="8" height="5" rx="3" fill="#173b42" opacity="0.25"/><rect x="813" y="505" width="24" height="5" rx="3" fill="#168c78" opacity="1"/><rect x="830" y="505" width="8" height="5" rx="3" fill="#173b42" opacity="0.25"/><rect x="847" y="505" width="8" height="5" rx="3" fill="#173b42" opacity="0.25"/><rect x="864" y="505" width="8" height="5" rx="3" fill="#173b42" opacity="0.25"/><rect x="881" y="505" width="8" height="5" rx="3" fill="#173b42" opacity="0.25"/><rect x="898" y="505" width="8" height="5" rx="3" fill="#173b42" opacity="0.25"/>
