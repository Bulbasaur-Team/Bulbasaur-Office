  <circle cx="866" cy="76" r="230" fill="#ffd76a" opacity=".08"/>
  <text x="48" y="52" font-family="Inter,Arial,sans-serif" font-size="11" font-weight="900" letter-spacing="2.4" fill="#ffd76a">08  /  ФОКУС ПИЛОТА</text>
  <text x="48" y="108" font-family="Inter,Arial,sans-serif" font-size="42" font-weight="850" letter-spacing="-1.2" fill="#f8f4e9">Пока один маршрут</text>
  <rect x="48" y="130" width="72" height="5" rx="3" fill="#ffd76a"/>
  <g style="--ink:#f8f4e9;--muted:#91a9b9;--accent:#ffd76a">
  <g transform="translate(48 164)">
