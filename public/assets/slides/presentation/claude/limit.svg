    <g fill="#91a9b9" opacity=".35"><circle cx="357" cy="23" r="9"/><circle cx="468" cy="7" r="9"/><circle cx="579" cy="23" r="9"/></g>
    <rect x="345" y="207" width="174" height="40" rx="20" fill="#38f2cf" fill-opacity=".14"/>
