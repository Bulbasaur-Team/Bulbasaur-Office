    <text x="217" y="177" text-anchor="middle" font-family="Inter,Arial" font-size="22" font-weight="900" fill="#f8f4e9">МОСКВА</text>
    <text x="647" y="106" text-anchor="middle" font-family="Inter,Arial" font-size="12" font-weight="900" letter-spacing="1.7" fill="#91a9b9">ТОЧКА B</text>
