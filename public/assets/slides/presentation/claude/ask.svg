<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540">

  <defs>
    <linearGradient id="night" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#06111c"/><stop offset="0.55" stop-color="#0a1b2b"/><stop offset="1" stop-color="#10263a"/>
    </linearGradient>
    <linearGradient id="mint" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="#38f2cf"/><stop offset="1" stop-color="#7effa5"/>
    </linearGradient>
    <linearGradient id="sun" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#ffd76a"/><stop offset="1" stop-color="#ff8a4c"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#ffffff" stop-opacity=".16"/><stop offset="1" stop-color="#ffffff" stop-opacity=".035"/>
    </linearGradient>
    <radialGradient id="glow"><stop stop-color="#38f2cf" stop-opacity=".35"/><stop offset="1" stop-color="#38f2cf" stop-opacity="0"/></radialGradient>
    <pattern id="grid" width="42" height="42" patternUnits="userSpaceOnUse">
      <path d="M42 0H0V42" fill="none" stroke="#8eb5c9" stroke-opacity=".07"/>
    </pattern>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="180%">
      <feDropShadow dx="0" dy="16" stdDeviation="17" flood-color="#000" flood-opacity=".35"/>
    </filter>
    <filter id="soft"><feGaussianBlur stdDeviation="12"/></filter>
    <filter id="photo"><feColorMatrix values="0.96 0 0 0 0  0 1.02 0 0 0  0 0 1.08 0 0  0 0 0 1 0"/></filter>
  </defs>
  <rect width="960" height="540" fill="url(#night)"/>
  <rect width="960" height="540" fill="url(#grid)" opacity="1"/>
  <circle cx="866" cy="76" r="230" fill="#ffd76a" opacity=".08"/>
  <text x="48" y="52" font-family="Inter,Arial,sans-serif" font-size="11" font-weight="900" letter-spacing="2.4" fill="#ffd76a">10  /  ИНВЕСТИЦИИ</text>
  <text x="48" y="108" font-family="Inter,Arial,sans-serif" font-size="40" font-weight="850" letter-spacing="-1.2" fill="#f8f4e9">Инвестиции: миллиарды BC</text>
  <rect x="48" y="130" width="72" height="5" rx="3" fill="#ffd76a"/>
  <g style="--ink:#f8f4e9;--muted:#91a9b9;--accent:#ffd76a">
  <g transform="translate(48 160)">
    <rect width="416" height="290" rx="34" fill="url(#sun)" filter="url(#shadow)"/>
    <text x="34" y="54" font-family="Inter,Arial" font-size="12" font-weight="950" letter-spacing="2" fill="#4b2915">ПРОСИМ</text>
    <text x="34" y="129" font-family="Inter,Arial" font-size="55" font-weight="950" letter-spacing="-2" fill="#1c2631">НЕСКОЛЬКО</text>
    <text x="34" y="190" font-family="Inter,Arial" font-size="55" font-weight="950" letter-spacing="-2" fill="#1c2631">МИЛЛИАРДОВ</text>
    <text x="34" y="252" font-family="Inter,Arial" font-size="55" font-weight="950" letter-spacing="-2" fill="#fff">BC</text>
  </g>
  <g transform="translate(502 160)">
    <text y="25" font-family="Inter,Arial" font-size="12" font-weight="900" letter-spacing="1.8" fill="#91a9b9">НА ЧТО</text>
    <g transform="translate(0 52)">
      <circle cx="24" cy="24" r="24" fill="#38f2cf" fill-opacity=".16"/><circle cx="24" cy="24" r="8" fill="#38f2cf"/>
      <text x="64" y="21" font-family="Inter,Arial" font-size="20" font-weight="900" fill="#f8f4e9">Точки назначения</text>
      <text x="64" y="43" font-family="Inter,Arial" font-size="14" font-weight="700" fill="#91a9b9">из одного хаба — в сеть</text>
    </g>
    <g transform="translate(0 128)">
      <circle cx="24" cy="24" r="24" fill="#ffd76a" fill-opacity=".16"/><path d="M17 24h14M24 17v14" stroke="#ffd76a" stroke-width="4" stroke-linecap="round"/>
      <text x="64" y="21" font-family="Inter,Arial" font-size="20" font-weight="900" fill="#f8f4e9">Токены моделям</text>
      <text x="64" y="43" font-family="Inter,Arial" font-size="14" font-weight="700" fill="#91a9b9">вернуть R&amp;D в online</text>
    </g>
    <g transform="translate(0 204)">
      <circle cx="24" cy="24" r="24" fill="#ff6b8d" fill-opacity=".16"/><path d="M14 29l10-14 10 14" fill="none" stroke="#ff6b8d" stroke-width="4" stroke-linecap="round"/>
      <text x="64" y="21" font-family="Inter,Arial" font-size="20" font-weight="900" fill="#f8f4e9">Уникальный продукт</text>
      <text x="64" y="43" font-family="Inter,Arial" font-size="14" font-weight="700" fill="#91a9b9">такого больше нет ни у кого</text>
    </g>
  </g></g>

  <text x="48" y="512" font-family="Inter,Arial,sans-serif" font-size="11" font-weight="800" letter-spacing="2.2" fill="#91a9b9">BULBA OFFICE  /  ДЕНЬ X</text>
  <rect x="745" y="505" width="8" height="5" rx="3" fill="#fff" opacity="0.25"/><rect x="762" y="505" width="8" height="5" rx="3" fill="#fff" opacity="0.25"/><rect x="779" y="505" width="8" height="5" rx="3" fill="#fff" opacity="0.25"/><rect x="796" y="505" width="8" height="5" rx="3" fill="#fff" opacity="0.25"/><rect x="813" y="505" width="8" height="5" rx="3" fill="#fff" opacity="0.25"/><rect x="830" y="505" width="8" height="5" rx="3" fill="#fff" opacity="0.25"/><rect x="847" y="505" width="8" height="5" rx="3" fill="#fff" opacity="0.25"/><rect x="864" y="505" width="8" height="5" rx="3" fill="#fff" opacity="0.25"/><rect x="881" y="505" width="8" height="5" rx="3" fill="#fff" opacity="0.25"/><rect x="898" y="505" width="24" height="5" rx="3" fill="#ffd76a" opacity="1"/>
</svg>